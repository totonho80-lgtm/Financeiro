<style>
/* ============ TOKENS ============ */
:root{
  --ink:#1C2333;
  --ink-2:#2A3145;
  --parchment:#F7F4EC;
  --paper:#FFFFFF;
  --line:#E4DFD2;
  --text:#2A2E35;
  --muted:#767B85;
  --erva:#2E6B3E;
  --erva-bg:#E9F3EA;
  --bebida:#1B5FA8;
  --bebida-bg:#E9F1FB;
  --atraso:#B23A2E;
  --atraso-bg:#FBEBE9;
  --aberto:#B8860B;
  --aberto-bg:#FBF3E1;
  --pago:#3D7A4F;
  --naoclass:#8B8F98;
  --naoclass-bg:#F0EFEC;
  --radius:14px;
  --shadow: 0 1px 2px rgba(28,35,51,0.06), 0 8px 24px -12px rgba(28,35,51,0.12);
}

*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0;
  background:var(--parchment);
  color:var(--text);
  font-family:'Public Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{
  font-family:'Fraunces', Georgia, serif;
  font-weight:600;
  letter-spacing:-0.01em;
  margin:0;
  color:var(--ink);
}
.mono{font-family:'IBM Plex Mono', monospace; font-variant-numeric:tabular-nums;}

a{color:inherit;}
button{font-family:inherit;}

/* ============ HEADER ============ */
.topbar{
  background:var(--ink);
  color:#F4F1E8;
  padding:22px 20px 0 20px;
  position:sticky;
  top:0;
  z-index:40;
  box-shadow:0 2px 12px rgba(0,0,0,0.18);
}
.topbar-inner{
  max-width:1180px;
  margin:0 auto;
}
.brand-row{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:8px 20px;
  padding-bottom:16px;
}
.brand-title{
  font-size:clamp(22px, 4vw, 30px);
  color:#FBF7EE;
}
.brand-sub{
  font-size:13px;
  color:#B9BECB;
  font-family:'IBM Plex Mono', monospace;
}
.ratio-bar{
  display:flex;
  height:10px;
  border-radius:999px;
  overflow:hidden;
  margin-bottom:16px;
  background:#0000;
}
.ratio-seg{height:100%;}
.ratio-legend{
  display:flex;
  gap:18px;
  flex-wrap:wrap;
  font-size:12.5px;
  color:#C7CBD6;
  padding-bottom:14px;
}
.ratio-legend span{display:inline-flex; align-items:center; gap:6px;}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;}

/* ============ NAV TABS ============ */
.tabs{
  display:flex;
  gap:2px;
  overflow-x:auto;
  scrollbar-width:none;
  -ms-overflow-style:none;
  border-top:1px solid rgba(255,255,255,0.08);
}
.tabs::-webkit-scrollbar{display:none;}
.tab-btn{
  flex:0 0 auto;
  background:none;
  border:none;
  color:#B9BECB;
  padding:14px 16px 12px 16px;
  font-size:14.5px;
  font-weight:600;
  cursor:pointer;
  border-bottom:3px solid transparent;
  white-space:nowrap;
  transition:color .15s ease;
}
.tab-btn:hover{color:#F4F1E8;}
.tab-btn.active{
  color:#FBF7EE;
  border-bottom-color:var(--aberto);
}

/* ============ LAYOUT ============ */
.wrap{
  max-width:1180px;
  margin:0 auto;
  padding:26px 20px 80px 20px;
}
.panel{display:none;}
.panel.active{display:block; animation:fadeIn .25s ease;}
@keyframes fadeIn{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}

/* ============ KPI CARDS ============ */
.kpi-grid{
  display:grid;
  grid-template-columns:repeat(4, 1fr);
  gap:14px;
  margin-bottom:28px;
}
@media (max-width:800px){ .kpi-grid{grid-template-columns:repeat(2,1fr);} }
.kpi-card{
  background:var(--paper);
  border-radius:var(--radius);
  padding:18px 18px 16px 18px;
  box-shadow:var(--shadow);
  border-top:4px solid var(--ink);
}
.kpi-card.c-erva{border-top-color:var(--erva);}
.kpi-card.c-bebida{border-top-color:var(--bebida);}
.kpi-card.c-nc{border-top-color:var(--naoclass);}
.kpi-label{
  font-size:11.5px;
  text-transform:uppercase;
  letter-spacing:.08em;
  color:var(--muted);
  font-weight:700;
  margin-bottom:8px;
}
.kpi-value{
  font-family:'Fraunces', serif;
  font-size:clamp(20px,2.6vw,26px);
  font-weight:600;
  color:var(--ink);
}
.kpi-pct{
  font-size:13px;
  color:var(--muted);
  margin-top:2px;
}

/* ============ SECTION TITLES ============ */
.section-title{
  display:flex;
  align-items:baseline;
  gap:10px;
  margin:34px 0 14px 0;
}
.section-title h2{font-size:19px;}
.section-title .count{
  font-size:13px;
  color:var(--muted);
  font-family:'IBM Plex Mono', monospace;
}
.section-title:first-child{margin-top:0;}

/* ============ SUMMARY TABLE (situacao) ============ */
.summary-table{
  width:100%;
  border-collapse:collapse;
  background:var(--paper);
  border-radius:var(--radius);
  overflow:hidden;
  box-shadow:var(--shadow);
}
.summary-table th{
  text-align:left;
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:.06em;
  color:#F4F1E8;
  background:var(--ink-2);
  padding:12px 14px;
  font-weight:700;
}
.summary-table td{
  padding:12px 14px;
  border-bottom:1px solid var(--line);
  font-size:14.5px;
}
.summary-table tr:last-child td{border-bottom:none;}
.summary-table tr.total-row td{
  font-weight:700;
  background:#F1EEE3;
}
.num{text-align:right; font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums;}
.pill{
  display:inline-block;
  padding:3px 10px;
  border-radius:999px;
  font-size:12.5px;
  font-weight:700;
}
.pill-pago{background:#E4F1E7; color:var(--pago);}
.pill-atraso{background:var(--atraso-bg); color:var(--atraso);}
.pill-aberto{background:var(--aberto-bg); color:var(--aberto);}
.pill-parcial{background:#EDE7F6; color:#5E4B9C;}
.pill-vencendo{background:#FDEFD8; color:#A05A00;}

/* ============ DATA TABLE (lists) ============ */
.controls-row{
  display:flex;
  gap:10px;
  align-items:center;
  margin-bottom:14px;
  flex-wrap:wrap;
}
.search-input{
  flex:1 1 240px;
  padding:10px 14px;
  border-radius:10px;
  border:1px solid var(--line);
  background:var(--paper);
  font-size:14.5px;
  font-family:inherit;
  color:var(--text);
}
.search-input:focus{outline:2px solid var(--aberto); outline-offset:1px;}
.total-chip{
  font-family:'IBM Plex Mono', monospace;
  font-size:13px;
  color:var(--muted);
  padding:9px 14px;
  background:var(--paper);
  border-radius:10px;
  border:1px solid var(--line);
  white-space:nowrap;
}
.table-scroll{
  overflow-x:auto;
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  background:var(--paper);
}
table.data-table{
  width:100%;
  border-collapse:collapse;
  min-width:600px;
}
table.data-table thead th{
  position:sticky;
  top:0;
  background:var(--ink-2);
  color:#F4F1E8;
  text-align:left;
  padding:11px 14px;
  font-size:11.5px;
  text-transform:uppercase;
  letter-spacing:.06em;
  cursor:pointer;
  user-select:none;
  white-space:nowrap;
}
table.data-table thead th .arrow{opacity:.5; font-size:10px; margin-left:4px;}
table.data-table tbody td{
  padding:10px 14px;
  border-bottom:1px solid var(--line);
  font-size:14px;
  white-space:nowrap;
}
table.data-table tbody td.wrap-cell{white-space:normal; min-width:200px;}
table.data-table tbody tr:nth-child(even){background:#FBF9F4;}
table.data-table tbody tr:hover{background:#F1EEE3;}
table.data-table tbody tr:last-child td{border-bottom:none;}
.foot-total td{
  font-weight:700;
  background:#F1EEE3 !important;
  border-top:2px solid var(--ink);
}
.empty-note{
  padding:30px 14px;
  text-align:center;
  color:var(--muted);
  font-size:14px;
}

/* ============ FOOTER ============ */
.footnote{
  margin-top:30px;
  font-size:12.5px;
  color:var(--muted);
  line-height:1.6;
  padding:14px 16px;
  background:#F1EEE3;
  border-radius:10px;
}

.scroll-hint{
  display:none;
  font-size:12px;
  color:var(--muted);
  text-align:right;
  margin:-6px 2px 8px 2px;
  font-family:'IBM Plex Mono',monospace;
  letter-spacing:.03em;
}

@media (max-width:640px){
  .wrap{padding:18px 12px 60px 12px;}
  .kpi-grid{grid-template-columns:1fr 1fr; gap:10px;}
  .kpi-card{padding:14px;}
  .scroll-hint{display:block;}

  /* card-style responsive list tables (4-col lists) */
  table.data-table.card-mode{min-width:0;}
  table.data-table.card-mode thead{position:absolute; left:-9999px; top:-9999px;}
  table.data-table.card-mode tbody tr{
    display:block;
    background:var(--paper);
    border-bottom:8px solid var(--parchment);
    padding:12px 14px;
  }
  table.data-table.card-mode tbody tr.foot-total{background:#F1EEE3; border-bottom:none;}
  table.data-table.card-mode tbody td{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    padding:5px 0;
    border-bottom:none;
    white-space:normal;
    font-size:14px;
  }
  table.data-table.card-mode tbody td::before{
    content:attr(data-label);
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:var(--muted);
    font-weight:700;
    flex:0 0 auto;
  }
  table.data-table.card-mode tbody td:first-child{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:16px;
    color:var(--ink);
  }
  table.data-table.card-mode tbody td:first-child::before{content:'';}
}
</style>
</head>

ESCO COROLESKI", "categoria": "VENDA À PRAZO", "vencimento": "31/08/2026"}, {"pedido": 8533, "cliente": "ESTACAO RURAL LTDA", "valor": 1307.47, "erva": 1307.47, "bebida": 0, "situacao": "Atrasada", "obs": "Ref. ao pedido de venda nº 8533", "descricao": "PIX 57.050.487/0001-34 BRADESCO COROLESKI", "categoria": "VENDAS À VISTA", "vencimento": "14/08/2026"}]

<script>
// ============================================================
// Fechamento Financeiro — Ervas & Bebidas — dashboard logic
// ============================================================

const RAW = JSON.parse(document.getElementById('dados-json').textContent);

const fmtBRL = (v) => 'R$ ' + (v || 0).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
const fmtPct = (v) => (v*100).toLocaleString('pt-BR', {minimumFractionDigits:1, maximumFractionDigits:1}) + '%';

// ---------- date parsing dd/mm/yyyy -> sortable ----------
function dateKey(s){
  if(!s) return 0;
  const m = String(s).match(/(\d{2})\/(\d{2})\/(\d{4})/);
  if(!m) return 0;
  return parseInt(m[3]+m[2]+m[1], 10);
}

// ---------- aggregates ----------
const totalGeral = RAW.reduce((a,r)=>a+r.valor, 0);
const totalErva = RAW.reduce((a,r)=>a+r.erva, 0);
const totalBebida = RAW.reduce((a,r)=>a+r.bebida, 0);
const totalNC = RAW.reduce((a,r)=> a + ((r.erva===0 && r.bebida===0) ? r.valor : 0), 0);

const SITUACOES = ['Pago','Atrasada','Em aberto','Parcial','Vencendo hoje'];
const sitStats = {};
SITUACOES.forEach(s=>{ sitStats[s] = {count:0, valor:0, erva:0, bebida:0, nc:0}; });
RAW.forEach(r=>{
  const s = sitStats[r.situacao] || (sitStats[r.situacao] = {count:0,valor:0,erva:0,bebida:0,nc:0});
  s.count++; s.valor += r.valor; s.erva += r.erva; s.bebida += r.bebida;
  if(r.erva===0 && r.bebida===0) s.nc += r.valor;
});

// top10 pedidos (aggregate installments by pedido)
const pedidoAgg = {};
RAW.forEach(r=>{
  if(!r.pedido) return;
  const key = r.pedido;
  if(!pedidoAgg[key]) pedidoAgg[key] = {pedido:r.pedido, cliente:r.cliente, valor:0};
  pedidoAgg[key].valor += r.valor;
});
const top10 = Object.values(pedidoAgg).sort((a,b)=>b.valor-a.valor).slice(0,10);

// derived lists
const atraso = RAW.filter(r=>r.situacao==='Atrasada')
  .map(r=>({pedido:r.pedido, cliente:r.cliente, valor:r.valor, vencimento:r.vencimento}))
  .sort((a,b)=>b.valor-a.valor);

function classedList(situacao, campo){
  return RAW.filter(r=>r.situacao===situacao && r[campo] > 0)
    .map(r=>({pedido:r.pedido, cliente:r.cliente, valor:r[campo], vencimento:r.vencimento}))
    .sort((a,b)=>b.valor-a.valor);
}
const abertoErvas = classedList('Em aberto','erva');
const abertoBebidas = classedList('Em aberto','bebida');
const pagosErvas = classedList('Pago','erva');
const pagosBebidas = classedList('Pago','bebida');

function chronoList(campo){
  return RAW.filter(r=>r[campo] > 0)
    .map(r=>({pedido:r.pedido, cliente:r.cliente, valor:r[campo], situacao:r.situacao, vencimento:r.vencimento}))
    .sort((a,b)=>dateKey(a.vencimento)-dateKey(b.vencimento));
}
const cronErvas = chronoList('erva');
const cronBebidas = chronoList('bebida');

// ============================================================
// RENDER: header ratio bar + legend
// ============================================================
function renderHeader(){
  const bar = document.getElementById('ratioBar');
  const legend = document.getElementById('ratioLegend');
  const segs = [
    {label:'Ervas', val:totalErva, color:'#4C9A5E'},
    {label:'Bebidas', val:totalBebida, color:'#3E86D6'},
    {label:'Não classificado', val:totalNC, color:'#6B707A'},
  ];
  bar.innerHTML = segs.map(s => `<div class="ratio-seg" style="width:${(s.val/totalGeral*100).toFixed(2)}%; background:${s.color};"></div>`).join('');
  legend.innerHTML = segs.map(s => `<span><span class="dot" style="background:${s.color}"></span>${s.label} · ${fmtBRL(s.val)} (${fmtPct(s.val/totalGeral)})</span>`).join('');
  document.getElementById('baseInfo').textContent = `base: relatorio_17_08_2026 · ${RAW.length} lançamentos · total R$ ${totalGeral.toLocaleString('pt-BR',{minimumFractionDigits:2})}`;
}

// ============================================================
// TABS
// ============================================================
const TABS = [
  {id:'resumo', label:'Resumo'},
  {id:'atraso', label:'Em Atraso'},
  {id:'aberto-ervas', label:'Aberto · Ervas'},
  {id:'aberto-bebidas', label:'Aberto · Bebidas'},
  {id:'pagos-ervas', label:'Pagos · Ervas'},
  {id:'pagos-bebidas', label:'Pagos · Bebidas'},
  {id:'cron-ervas', label:'Cronológico · Ervas'},
  {id:'cron-bebidas', label:'Cronológico · Bebidas'},
  {id:'todos', label:'Todos os Lançamentos'},
];

function renderTabs(){
  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = TABS.map((t,i)=>`<button class="tab-btn${i===0?' active':''}" data-tab="${t.id}">${t.label}</button>`).join('');
  tabsEl.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      tabsEl.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
      document.getElementById('panel-'+btn.dataset.tab).classList.add('active');
      window.scrollTo({top:0, behavior:'instant'});
    });
  });
}

// ============================================================
// RESUMO PANEL
// ============================================================
function pillFor(sit){
  const map = {'Pago':'pill-pago','Atrasada':'pill-atraso','Em aberto':'pill-aberto','Parcial':'pill-parcial','Vencendo hoje':'pill-vencendo'};
  return `<span class="pill ${map[sit]||''}">${sit}</span>`;
}

function renderResumo(container){
  let html = '';

  // KPI cards
  html += `<div class="kpi-grid">
    <div class="kpi-card"><div class="kpi-label">Total Geral</div><div class="kpi-value">${fmtBRL(totalGeral)}</div><div class="kpi-pct">${RAW.length} lançamentos</div></div>
    <div class="kpi-card c-erva"><div class="kpi-label">Ervas</div><div class="kpi-value">${fmtBRL(totalErva)}</div><div class="kpi-pct">${fmtPct(totalErva/totalGeral)} do total</div></div>
    <div class="kpi-card c-bebida"><div class="kpi-label">Bebidas</div><div class="kpi-value">${fmtBRL(totalBebida)}</div><div class="kpi-pct">${fmtPct(totalBebida/totalGeral)} do total</div></div>
    <div class="kpi-card c-nc"><div class="kpi-label">Não Classificado</div><div class="kpi-value">${fmtBRL(totalNC)}</div><div class="kpi-pct">${fmtPct(totalNC/totalGeral)} do total</div></div>
  </div>`;

  // situacao summary
  html += `<div class="section-title"><h2>Resumo por Situação</h2></div>`;
  html += `<table class="summary-table"><thead><tr><th>Situação</th><th style="text-align:right">Qtd.</th><th style="text-align:right">Valor Total</th><th style="text-align:right">% do Total</th></tr></thead><tbody>`;
  SITUACOES.forEach(s=>{
    const d = sitStats[s];
    if(!d || d.count===0) return;
    html += `<tr><td>${pillFor(s)}</td><td class="num">${d.count}</td><td class="num">${fmtBRL(d.valor)}</td><td class="num">${fmtPct(d.valor/totalGeral)}</td></tr>`;
  });
  html += `<tr class="total-row"><td>TOTAL</td><td class="num">${RAW.length}</td><td class="num">${fmtBRL(totalGeral)}</td><td class="num">100,0%</td></tr>`;
  html += `</tbody></table>`;

  // erva x bebida por situacao
  html += `<div class="section-title"><h2>Ervas × Bebidas por Situação</h2></div>`;
  html += `<table class="summary-table"><thead><tr><th>Situação</th><th style="text-align:right">Ervas</th><th style="text-align:right">Bebidas</th><th style="text-align:right">Não Classif.</th></tr></thead><tbody>`;
  SITUACOES.forEach(s=>{
    const d = sitStats[s];
    if(!d || d.count===0) return;
    html += `<tr><td>${pillFor(s)}</td><td class="num">${fmtBRL(d.erva)}</td><td class="num">${fmtBRL(d.bebida)}</td><td class="num">${fmtBRL(d.nc)}</td></tr>`;
  });
  html += `<tr class="total-row"><td>TOTAL</td><td class="num">${fmtBRL(totalErva)}</td><td class="num">${fmtBRL(totalBebida)}</td><td class="num">${fmtBRL(totalNC)}</td></tr>`;
  html += `</tbody></table>`;

  // top 10
  html += `<div class="section-title"><h2>Top 10 Maiores Pedidos</h2></div>`;
  html += `<table class="summary-table"><thead><tr><th>Nº Pedido</th><th>Cliente</th><th style="text-align:right">Valor Total</th></tr></thead><tbody>`;
  top10.forEach(p=>{
    html += `<tr><td class="mono">#${p.pedido}</td><td>${p.cliente||'—'}</td><td class="num">${fmtBRL(p.valor)}</td></tr>`;
  });
  html += `</tbody></table>`;

  html += `<div class="footnote">Classificação de Ervas/Bebidas obtida por produto (PEDIDOS_DE_VENDA), com fallback proporcional a partir da planilha de fechamento anterior quando o pedido não constava na exportação de produtos. Itens sem pedido de venda associado (aluguel, IPVA, adiantamentos, renegociações etc.) permanecem em "Não Classificado".</div>`;

  container.innerHTML = html;
}

// ============================================================
// SIMPLE LIST PANEL (atraso / aberto / pagos)
// ============================================================
function renderListPanel(container, data, opts){
  const total = data.reduce((a,r)=>a+r.valor,0);
  const wrapId = opts.id;
  container.innerHTML = `
    <div class="section-title"><h2>${opts.title}</h2><span class="count">${data.length} pedidos</span></div>
    <div class="controls-row">
      <input class="search-input" type="text" placeholder="Buscar por cliente ou nº do pedido..." id="search-${wrapId}">
      <div class="total-chip">Total: ${fmtBRL(total)}</div>
    </div>
    <div class="table-scroll">
      <table class="data-table card-mode" id="table-${wrapId}">
        <thead>
          <tr>
            <th data-key="pedido">Nº Pedido <span class="arrow">▾</span></th>
            <th data-key="cliente">Cliente <span class="arrow">▾</span></th>
            <th data-key="valor" style="text-align:right">Valor (R$) <span class="arrow">▾</span></th>
            <th data-key="vencimento" style="text-align:right">Vencimento <span class="arrow">▾</span></th>
          </tr>
        </thead>
        <tbody id="tbody-${wrapId}"></tbody>
      </table>
    </div>
  `;

  let sortKey = 'valor', sortDir = -1;
  let filterText = '';

  function draw(){
    let rows = data.filter(r=>{
      if(!filterText) return true;
      const hay = (String(r.pedido||'') + ' ' + (r.cliente||'')).toLowerCase();
      return hay.includes(filterText);
    });
    rows = rows.slice().sort((a,b)=>{
      let va = a[sortKey], vb = b[sortKey];
      if(sortKey==='vencimento'){ va = dateKey(va); vb = dateKey(vb); }
      if(typeof va === 'string'){ va = va.toLowerCase(); vb = (vb||'').toLowerCase(); }
      if(va < vb) return -1*sortDir;
      if(va > vb) return 1*sortDir;
      return 0;
    });
    const tbody = document.getElementById('tbody-'+wrapId);
    if(rows.length===0){
      tbody.innerHTML = `<tr><td colspan="4" class="empty-note">Nenhum resultado encontrado.</td></tr>`;
    } else {
      tbody.innerHTML = rows.map(r=>`
        <tr>
          <td class="mono" data-label="Pedido">${r.pedido? '#'+r.pedido : '—'}</td>
          <td class="wrap-cell" data-label="Cliente">${r.cliente||'Não identificado'}</td>
          <td class="num" data-label="Valor">${fmtBRL(r.valor)}</td>
          <td class="num mono" data-label="Vencimento">${r.vencimento||'—'}</td>
        </tr>`).join('');
      const shownTotal = rows.reduce((a,r)=>a+r.valor,0);
      tbody.innerHTML += `<tr class="foot-total"><td data-label="" colspan="2">Subtotal (${rows.length})</td><td class="num" data-label="Total">${fmtBRL(shownTotal)}</td><td data-label=""></td></tr>`;
    }
  }

  document.getElementById('search-'+wrapId).addEventListener('input', (e)=>{
    filterText = e.target.value.trim().toLowerCase();
    draw();
  });
  document.querySelectorAll(`#table-${wrapId} thead th`).forEach(th=>{
    th.addEventListener('click', ()=>{
      const key = th.dataset.key;
      if(sortKey===key){ sortDir *= -1; } else { sortKey = key; sortDir = key==='cliente'||key==='pedido' ? 1 : -1; }
      draw();
    });
  });

  draw();
}

// ============================================================
// CHRONOLOGICAL LIST PANEL (all situations, sorted by date, with situação pill)
// ============================================================
function renderChronoPanel(container, data, opts){
  const total = data.reduce((a,r)=>a+r.valor,0);
  const wrapId = opts.id;
  container.innerHTML = `
    <div class="section-title"><h2>${opts.title}</h2><span class="count">${data.length} recebimentos</span></div>
    <div class="controls-row">
      <input class="search-input" type="text" placeholder="Buscar por cliente ou nº do pedido..." id="search-${wrapId}">
      <select class="search-input" style="flex:0 0 170px;" id="filter-${wrapId}-sit">
        <option value="">Todas situações</option>
        ${SITUACOES.map(s=>`<option value="${s}">${s}</option>`).join('')}
      </select>
      <div class="total-chip">Total: ${fmtBRL(total)}</div>
    </div>
    <div class="table-scroll">
      <table class="data-table card-mode" id="table-${wrapId}">
        <thead>
          <tr>
            <th data-key="vencimento">Vencimento <span class="arrow">▾</span></th>
            <th data-key="pedido">Nº Pedido <span class="arrow">▾</span></th>
            <th data-key="cliente">Cliente <span class="arrow">▾</span></th>
            <th data-key="valor" style="text-align:right">Valor (R$) <span class="arrow">▾</span></th>
            <th data-key="situacao">Situação <span class="arrow">▾</span></th>
          </tr>
        </thead>
        <tbody id="tbody-${wrapId}"></tbody>
      </table>
    </div>
  `;

  let sortKey = 'vencimento', sortDir = 1;
  let filterText = '', filterSit = '';

  function draw(){
    let rows = data.filter(r=>{
      if(filterSit && r.situacao!==filterSit) return false;
      if(!filterText) return true;
      const hay = (String(r.pedido||'') + ' ' + (r.cliente||'')).toLowerCase();
      return hay.includes(filterText);
    });
    rows = rows.slice().sort((a,b)=>{
      let va = a[sortKey], vb = b[sortKey];
      if(sortKey==='vencimento'){ va = dateKey(va); vb = dateKey(vb); }
      if(typeof va === 'string'){ va = va.toLowerCase(); vb = (vb||'').toLowerCase(); }
      if(va < vb) return -1*sortDir;
      if(va > vb) return 1*sortDir;
      return 0;
    });
    const tbody = document.getElementById('tbody-'+wrapId);
    if(rows.length===0){
      tbody.innerHTML = `<tr><td colspan="5" class="empty-note">Nenhum resultado encontrado.</td></tr>`;
    } else {
      tbody.innerHTML = rows.map(r=>`
        <tr>
          <td class="mono" data-label="Vencimento">${r.vencimento||'—'}</td>
          <td class="mono" data-label="Pedido">${r.pedido? '#'+r.pedido : '—'}</td>
          <td class="wrap-cell" data-label="Cliente">${r.cliente||'Não identificado'}</td>
          <td class="num" data-label="Valor">${fmtBRL(r.valor)}</td>
          <td data-label="Situação">${pillFor(r.situacao)}</td>
        </tr>`).join('');
      const shownTotal = rows.reduce((a,r)=>a+r.valor,0);
      tbody.innerHTML += `<tr class="foot-total"><td data-label="" colspan="3">Subtotal (${rows.length})</td><td class="num" data-label="Total">${fmtBRL(shownTotal)}</td><td data-label=""></td></tr>`;
    }
  }

  document.getElementById('search-'+wrapId).addEventListener('input', (e)=>{
    filterText = e.target.value.trim().toLowerCase();
    draw();
  });
  document.getElementById('filter-'+wrapId+'-sit').addEventListener('change', (e)=>{
    filterSit = e.target.value;
    draw();
  });
  document.querySelectorAll(`#table-${wrapId} thead th`).forEach(th=>{
    th.addEventListener('click', ()=>{
      const key = th.dataset.key;
      if(sortKey===key){ sortDir *= -1; } else { sortKey = key; sortDir = (key==='cliente'||key==='situacao') ? 1 : (key==='vencimento' ? 1 : -1); }
      draw();
    });
  });

  draw();
}

function buildPanels(){
  const wrap = document.getElementById('wrap');
  TABS.forEach((t,i)=>{
    const p = document.createElement('div');
    p.className = 'panel' + (i===0?' active':'');
    p.id = 'panel-'+t.id;
    wrap.appendChild(p);
  });

  renderResumo(document.getElementById('panel-resumo'));
  renderListPanel(document.getElementById('panel-atraso'), atraso, {id:'atraso', title:'Pedidos em Atraso'});

  renderListPanel(document.getElementById('panel-aberto-bebidas'), abertoBebidas, {id:'aberto-bebidas', title:'Pedidos em Aberto — Bebidas'});
  renderListPanel(document.getElementById('panel-pagos-ervas'), pagosErvas, {id:'pagos-ervas', title:'Pedidos Pagos — Ervas'});

}
